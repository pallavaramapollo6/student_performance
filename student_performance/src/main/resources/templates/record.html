<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Record</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            margin: 0;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px #00000012;
        }

        .header {
            background: #173b68;
            color: white;
            padding: 22px 30px;
        }

        .layout {
            display: flex;
            min-height: 500px;
        }

        .menu {
            width: 190px;
            flex-shrink: 0;
            background: #edf2f8;
        }

        .menu a {
            display: block;
            padding: 18px;
            border-bottom: 1px solid #d4dce8;
            text-decoration: none;
            color: #173b68;
        }

        .menu a:hover {
            background: #dbe6f4;
        }

        .content {
            padding: 25px;
            flex: 1;
            min-width: 0;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .detail {
            background: #f5f7fb;
            border: 1px solid #e0e5ed;
            border-radius: 6px;
            padding: 14px;
            overflow-wrap: anywhere;
        }

        .detail span {
            display: block;
            color: #667085;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .detail strong {
            font-size: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #d7dce5;
            padding: 13px;
            text-align: left;
        }

        th {
            background: #eaf0f8;
        }

        input {
            width: 100%;
            max-width: 180px;
            box-sizing: border-box;
            padding: 9px;
            border: 1px solid #c8cfda;
            border-radius: 4px;
        }

        button {
            background: #173b68;
            color: white;
            border: none;
            padding: 11px 28px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #24558e;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .success {
            background: #e3f7e9;
            color: #176534;
        }

        .error {
            background: #fde8e8;
            color: #9b1c1c;
        }

        @media (max-width: 650px) {
            .container {
                margin: 10px;
            }

            .layout {
                flex-direction: column;
            }

            .menu {
                width: 100%;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .content {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <h2>Student Performance Management</h2>
        <p>Student Marks and Attendance Record</p>
    </div>

    <div class="layout">

        <nav class="menu">
            <a href="/record">Student Record</a>
            <a href="/performance">Performance Analysis</a>
        </nav>

        <main class="content">

            <h2>Record Student Details</h2>

            <p class="message error"
               th:if="${error != null}"
               th:text="${error}"></p>

            <p class="message success"
               th:if="${success != null}"
               th:text="${success}"></p>

            <div th:if="${student != null and marks != null}">

                <div class="details">
                    <div class="detail">
                        <span>Registration Number</span>
                        <strong th:text="${student.regNo}"></strong>
                    </div>

                    <div class="detail">
                        <span>Student Name</span>
                        <strong th:text="${student.name}"></strong>
                    </div>

                    <div class="detail">
                        <span>Department</span>
                        <strong th:text="${student.department}"></strong>
                    </div>
                </div>

                <form action="/record" method="post">

                    <input type="hidden"
                           name="regNo"
                           th:value="${student.regNo}">

                    <table>
                        <thead>
                        <tr>
                            <th>Subject / Detail</th>
                            <th>Marks / Percentage</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr>
                            <td>Python</td>
                            <td>
                                <input type="number"
                                       name="pythonMarks"
                                       min="0" max="100"
                                       step="1"
                                       th:value="${marks.pythonMarks}">
                            </td>
                        </tr>

                        <tr>
                            <td>SQL</td>
                            <td>
                                <input type="number"
                                       name="sqlMarks"
                                       min="0" max="100"
                                       step="1"
                                       th:value="${marks.sqlMarks}">
                            </td>
                        </tr>

                        <tr>
                            <td>Java</td>
                            <td>
                                <input type="number"
                                       name="javaMarks"
                                       min="0" max="100"
                                       step="1"
                                       th:value="${marks.javaMarks}">
                            </td>
                        </tr>

                        <tr>
                            <td>Attendance (%)</td>
                            <td>
                                <input type="number"
                                       name="attendance"
                                       min="0" max="100"
                                       step="0.01"
                                       th:value="${marks.attendance}">
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <button type="submit">Save Record</button>
                </form>

            </div>
        </main>
    </div>
</div>
</body>
</html>
