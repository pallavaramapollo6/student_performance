
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Student Attendance</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
        }

        .header {
            background: #173b68;
            color: white;
            padding: 22px 35px;
        }

        .container {
            max-width: 650px;
            margin: 45px auto;
            padding: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        h2 {
            color: #173b68;
            margin-top: 0;
        }

        .student-details {
            background: #f1f5fa;
            padding: 15px;
            border-radius: 7px;
            margin-bottom: 25px;
        }

        .student-details p {
            margin: 10px 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            background: #173b68;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            margin-top: 25px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #24558e;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .result {
            background: #eaf0f8;
            padding: 15px;
            margin-top: 20px;
            border-radius: 7px;
        }

        .links {
            margin-top: 20px;
        }

        .links a {
            color: #173b68;
            text-decoration: none;
            margin-right: 15px;
        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <h2>Student Performance Management</h2>

        <p>Student Attendance Record</p>

    </div>


    <div class="container">

        <div class="card">

            <h2>Student Attendance</h2>


            <!-- STUDENT DETAILS -->

            <div class="student-details"
                 th:if="${student != null}">

                <p>
                    Student ID :
                    <b th:text="${student.regNo}"></b>
                </p>

                <p>
                    Student Name :
                    <b th:text="${student.name}"></b>
                </p>

                <p>
                    Department :
                    <b th:text="${student.department}"></b>
                </p>

            </div>


            <!-- SUCCESS MESSAGE -->

            <div class="message success"
                 th:if="${attendanceSuccess != null}"
                 th:text="${attendanceSuccess}">
            </div>


            <!-- ERROR MESSAGE -->

            <div class="message error"
                 th:if="${attendanceError != null}"
                 th:text="${attendanceError}">
            </div>


            <!-- ATTENDANCE FORM -->

            <form th:action="@{/attendance}"
                  method="post">

                <label>Days Present</label>

                <input type="number"
                       name="daysPresent"
                       min="0"
                       required
                       placeholder="Enter days present"
                       th:value="${attendance != null ? attendance.daysPresent : ''}">


                <label>Total Days</label>

                <input type="number"
                       name="totalDays"
                       min="1"
                       required
                       placeholder="Enter total working days"
                       th:value="${attendance != null ? attendance.totalDays : ''}">


                <button type="submit">
                    Save Attendance
                </button>

            </form>


            <!-- SAVED ATTENDANCE -->

            <div class="result"
                 th:if="${attendance != null}">

                <h3>Attendance Details</h3>

                <p>
                    Days Present:
                    <b th:text="${attendance.daysPresent}"></b>
                </p>

                <p>
                    Total Days:
                    <b th:text="${attendance.totalDays}"></b>
                </p>

                <p>
                    Attendance Percentage:
                    <b th:text="${#numbers.formatDecimal(attendance.attendance, 1, 2) + '%'}"></b>
                </p>

            </div>


            <!-- NAVIGATION -->

            <div class="links">

                <a th:href="@{/record}">
                    Student Record
                </a>

                <a th:href="@{/performance}">
                    Performance Analysis
                </a>

            </div>

        </div>

    </div>

</body>

</html>
