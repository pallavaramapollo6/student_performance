
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Attendance</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 40px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #999;
        }

        h1, h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        .message {
            padding: 10px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Student Attendance</h1>

    <p class="message"
       th:if="${success != null}"
       th:text="${success}"></p>

    <p class="message"
       th:if="${error != null}"
       th:text="${error}"></p>

    <form th:action="@{/attendance/save}"
          th:object="${marks}"
          method="post">

        <label for="studentId">Student Registration Number</label>
        <input type="text"
               id="studentId"
               th:field="*{studentId}"
               placeholder="Enter registration number"
               required>

        <label for="attendance">Attendance Percentage (%)</label>
        <input type="number"
               id="attendance"
               th:field="*{attendance}"
               placeholder="Enter attendance percentage"
               min="0"
               max="100"
               step="0.01"
               required>

        <button type="submit">Save Attendance</button>
    </form>

    <h2>Attendance Records</h2>

    <table>
        <thead>
        <tr>
            <th>Student ID</th>
            <th>Attendance (%)</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="record : ${records}">
            <td th:text="${record.studentId}"></td>
            <td th:text="${record.attendance}"></td>
        </tr>

        <tr th:if="${#lists.isEmpty(records)}">
            <td colspan="2">No attendance records found.</td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
